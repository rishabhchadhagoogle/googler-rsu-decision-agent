[project]
name = "googler-rsu-decision-agent"
version = "1.0.0"
description = "Enterprise ADK 2.0 Agent helping Google employees evaluate RSU sell-vs-hold decisions across US Federal/State/City taxes, multi-tranche vesting schedules, and 6-month GOOG stock & analyst research."
authors = [
    {name = "Rishabh Chadha", email = "rishabhchadha@google.com"},
]
requires-python = ">=3.11,<3.14"

dependencies = [
    "google-adk[gcp,otel-gcp,bigquery-analytics]>=2.7.0,<3.0.0",
    "google-cloud-agentplatform[agent-engines]>=2.2.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=2.2.0,<3.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-secret-manager>=2.20.0,<3.0.0",
    "google-cloud-dlp>=3.21.0,<4.0.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
